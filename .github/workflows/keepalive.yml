name: Keepalive
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit to keep scheduled workflows active
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@github.com"
          git commit --allow-empty -m "keepalive: prevent 60-day scheduled workflow disable"
          git push
